<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sana Özel Bir Mektup ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #040308;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Arka Plan Canvas */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Ortam Işığı */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(224, 169, 109, 0.2) 0%, rgba(100, 223, 223, 0.1) 40%, rgba(0,0,0,0) 75%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        /* Üst Başlık */
        .header-box {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 20;
            width: 90%;
            max-width: 400px;
        }

        .header-badge {
            display: inline-block;
            padding: 6px 18px;
            background: rgba(224, 169, 109, 0.12);
            border: 1px solid rgba(224, 169, 109, 0.3);
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 2px;
            color: #e0a96d;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #e0a96d, #64dfdf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-sub {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* ==================== 3D KÜP ALANI ==================== */
        .scene {
            width: 180px;
            height: 180px;
            position: relative;
            z-index: 10;
            cursor: grab;
        }

        .scene:active {
            cursor: grabbing;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .cube-face {
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(20, 16, 38, 0.65);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1.5px solid rgba(224, 169, 109, 0.4);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(224, 169, 109, 0.15), 0 0 25px rgba(0,0,0,0.5);
            color: #fff;
            text-align: center;
            padding: 15px;
        }

        .face-front  { transform: rotateY(  0deg) translateZ(90px); }
        .face-back   { transform: rotateY(180deg) translateZ(90px); }
        .face-right  { transform: rotateY( 90deg) translateZ(90px); }
        .face-left   { transform: rotateY(-90deg) translateZ(90px); }
        .face-top    { transform: rotateX( 90deg) translateZ(90px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(90px); }

        .cube-icon {
            font-size: 36px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(224, 169, 109, 0.6));
        }

        .cube-text {
            font-size: 12px;
            font-weight: 700;
            color: #e0a96d;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Alt Buton */
        .open-btn {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #e0a96d, #b8874c);
            color: #080612;
            border: none;
            padding: 15px 36px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 10px 30px rgba(224, 169, 109, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .open-btn:active {
            transform: translateX(-50%) scale(0.95);
        }

        /* ==================== MEKTUP MODAL POPUP ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 3, 8, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: rgba(18, 14, 36, 0.92);
            border: 1.5px solid rgba(224, 169, 109, 0.5);
            border-radius: 32px;
            padding: 30px 22px;
            max-width: 440px;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.95), 0 0 60px rgba(224, 169, 109, 0.2);
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        @keyframes modalPop {
            0% { transform: scale(0.7) translateY(30deg); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-badge {
            font-size: 11px;
            color: #e0a96d;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-align: center;
        }

        .modal-text {
            font-size: 14.5px;
            line-height: 1.85;
            color: #e5e7eb;
            margin-bottom: 25px;
            text-align: left;
            white-space: pre-line;
        }

        .modal-close {
            background: linear-gradient(135deg, #e0a96d, #b8874c);
            color: #080612;
            border: none;
            padding: 13px 32px;
            border-radius: 18px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 8px 25px rgba(224, 169, 109, 0.3);
        }

        .touch-heart {
            position: fixed;
            font-size: 24px;
            pointer-events: none;
            animation: heartFade 1s ease-out forwards;
            z-index: 200;
        }

        @keyframes heartFade {
            0% { opacity: 1; transform: scale(0.5) translateY(0); }
            100% { opacity: 0; transform: scale(1.4) translateY(-50px); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="ambient-glow"></div>

    <div class="header-box">
        <div class="header-badge">✦ SANA ÖZEL ✦</div>
        <div class="header-title">Zamansız Bir Mektup 📜</div>
        <div class="header-sub">Küpü parmağınla çevir veya aşağıdaki butona dokun</div>
    </div>

    <!-- 3D Küp -->
    <div class="scene" id="scene">
        <div class="cube" id="cube">
            <div class="cube-face face-front" onclick="openLetter()">
                <div class="cube-icon">✨</div>
                <div class="cube-text">Dokun & Oku</div>
            </div>
            <div class="cube-face face-back" onclick="openLetter()">
                <div class="cube-icon">🫠</div>
                <div class="cube-text">Bizim Hayalimiz</div>
            </div>
            <div class="cube-face face-right" onclick="openLetter()">
                <div class="cube-icon">💖</div>
                <div class="cube-text">Minik Yıldızım</div>
            </div>
            <div class="cube-face face-left" onclick="openLetter()">
                <div class="cube-icon">🌙</div>
                <div class="cube-text">Huzur Kapım</div>
            </div>
            <div class="cube-face face-top" onclick="openLetter()">
                <div class="cube-icon">👑</div>
                <div class="cube-text">Prensesim</div>
            </div>
            <div class="cube-face face-bottom" onclick="openLetter()">
                <div class="cube-icon">💌</div>
                <div class="cube-text">Kalbimden Sana</div>
            </div>
        </div>
    </div>

    <button class="open-btn" onclick="openLetter()">Mektubu Aç ✉️</button>

    <!-- Mektup Modal Popup -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-badge">✦ BİZİM HAYALİMİZ ✦</div>
            <div class="modal-text" id="letterContent"></div>
            <button class="modal-close" onclick="closeLetter()">Kalbine Sakla ❤️</button>
        </div>
    </div>

    <script>
        /* Mektup Metni */
        const letterText = `Bunu yapmayalı uzun zaman oldu. Tozlu raftan çıkarmak istedim. Böyle bir şey istediğini sürekli biliyorum;) O yüzden şimdi tekrar yapma kararı aldım:) Sana gün içerisinde yazamadığım içinde çok özür diliyorum senden. Sadece akşamları yazabiliyorum birde aralarda işte o da çok kısalığına. Neyse başlıyorum ben o zaman. :)

Hayal kurmayı çok seviyorsun özellikle ben yapınca (🫠) ki bunu bende çok seviyorum o yüzden tekrar hayal kuracağım. 

Bir sabah uyandığımda seni görüyorum. Çok tatlı uyuyorsun ve arkandan güneş ışığı vuruyor. Güneş ışığı vuruncada saçların çok güzel gözüküyor. Sanki bir tanrıça yatıyor yanımda diye düşündüm. Sonra seni öperek uyandırdım ve çok mutlu oldu. Hemde o kadar çok mutlu oldun ki bir anda beni kollarınla ve bacaklarınla sarıp sarmaladın beni. Bende sana sarıldım ve senin kokunu içime çektim. O kokuyu bir daha unutmayacak şekilde hemde. Sonra bir anda koşuya çıkalım mı diye fısıldadın. Bende sana baktım ve biraz ısınalım benim başka bir fikrim var dedim. Bugün seni basketbola davet ediyorum dedim ve sen bir anda çok mutlu oldun. O kadar çok mutlu oldun ki anlatamam. Kıyafetlerimizi giyip hazırlandıktan sonra dışarı çıktık ve biraz yürüdük ve aynı zamanda ısındık. Ben sana basketbolu öğretmeye başladım sende hızlıca kaptın. Sonra bir anda beni düelloya çağırdın ve ben dünyanın en güzel prensesiyle düello yapmayacağımı söyledim. Bir an duraksadın ama öyle diyince mutlu oldun. Daha sonra başka bir şey ortaya koydun. Her attığın şut bir öpücük dedin (😳) Ben o zaman başladım atmaya. Sende sürekli YA YETERRR diyeceğin anda ben seni belinden çekip sana tatlı bir an yaşattım. Hiç beklemiyordun böyle bir şey ama çok hoşlandın bunu yaptığımda. Daha sonra eve geçtik ve duş aldık. Ben senin saçlarını yıkadım sende benimkini (senin karşında eğildim:) Duştan çıkınca saçlarını taradım ve kurulamana yardım ettim. Sonrasında salonda oturmaya gittik Belli bir süre sonra yorgun düştün ve uyuya kaldın kollarımın arasında. Bende senin saçlarını nazikçe okşamaya başladım. Senin için çok güzel şeyler söyledim. Mesela çok güzel bir kız olduğunu, kalbimi senin için verebileceğimi, sen bu hayatta tanıdığım ve karşılaştığım en güzel şey olduğunu gibi şeyler. Sonra bende bana sarılırken uyuya kaldım. Daha sonra sen uyandın ve bana baktın. Uyuduğumu gördün ve çok nazik bir şekilde beni uyandırmadan kollarınla beni sardın ve saçlarımla oynamaya başladın. İşte o zaman ben kendimi çok ama çok daha huzurlu hissettim ve sana geri sarıldım. ve öylece uyuduk birlikte.`;

        document.getElementById('letterContent').innerText = letterText;

        /* ==================== CANLI YILDIZ CANVAS ==================== */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        for (let i = 0; i < 75; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        /* Dokunma Kalpleri */
        window.addEventListener('click', (e) => {
            if (e.target.closest('.modal-card') || e.target.closest('.open-btn')) return;
            const heart = document.createElement('div');
            heart.classList.add('touch-heart');
            heart.innerText = ['❤️', '✨', '🫠', '💖'][Math.floor(Math.random() * 4)];
            heart.style.left = (e.clientX - 12) + 'px';
            heart.style.top = (e.clientY - 12) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        });

        /* ==================== 3D KÜP ÇEVİRME KONTROLÜ ==================== */
        const cube = document.getElementById('cube');
        const scene = document.getElementById('scene');
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let rotation = { x: -20, y: 30 };

        function updateCubeRotation() {
            cube.style.transform = `rotateX(${rotation.x}deg) rotateY(${rotation.y}deg)`;
        }
        updateCubeRotation();

        // Otomatik yavaş dönüş
        let autoRotate = setInterval(() => {
            if (!isDragging) {
                rotation.y += 0.4;
                updateCubeRotation();
            }
        }, 30);

        function startDrag(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            previousMousePosition = { x: clientX, y: clientY };
        }

        function drag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - previousMousePosition.x;
            const deltaY = clientY - previousMousePosition.y;

            rotation.y += deltaX * 0.6;
            rotation.x -= deltaY * 0.6;

            updateCubeRotation();
            previousMousePosition = { x: clientX, y: clientY };
        }

        function endDrag() {
            isDragging = false;
        }

        scene.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);

        scene.addEventListener('touchstart', startDrag);
        window.addEventListener('touchmove', drag);
        window.addEventListener('touchend', endDrag);

        /* ==================== MODAL KONTROL ==================== */
        function openLetter() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeLetter() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
